tags:
  - Auth
summary: Login user
operationId: loginUser
description: 'Login a user with payload'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: "User's email"
            type: string
            example: 'example@gmail.com'
          password:
            description: "User's password"
            type: string
            example: example123
responses:
  '200':
    description: Logged in user
    content:
      application/json:
        schema:
          type: object
          $ref: '../../../components/schemas/user.yaml'
  '401':
    $ref: '../../../components/responses/login/401.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
